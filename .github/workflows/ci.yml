# Tests and catalogue validation on every push and pull request.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install "requests==2.32.*"

      - name: JavaScript tests
        run: npm test

      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Catalogue validation
        run: python scripts/validate_catalogue.py
