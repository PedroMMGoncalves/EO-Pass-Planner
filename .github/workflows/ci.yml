# Unit tests and catalogue validation. Kept small: documentation-only changes
# do not trigger it, and a newer push cancels a running one.
name: ci

on:
  push:
    paths-ignore: ["**.md", "docs/**", "assets/**", "data/plans/**", "data/tle_history/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-data.txt

      - run: pip install -r .github/requirements-data.txt

      - name: JavaScript tests
        run: npm test

      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Catalogue validation
        run: python scripts/validate_catalogue.py

      - name: Palette check (colour-vision deficiency)
        run: node scripts/check_palette.mjs
