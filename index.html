<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EO Pass Planner</title>
  <meta name="description" content="Quando é que os satélites de observação da Terra vão observar um local: passagens, cobertura, geometria e iluminação.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2317283A' stroke-width='3'/%3E%3Ccircle cx='26' cy='9' r='4' fill='%231F7A8C'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="answer-bar">
    <p class="wordmark">EO Pass Planner</p>
    <div class="answer" aria-live="polite">
      <p id="answer-main" class="answer-main" data-i18n="answer_idle">Escolhe um local no globo para saber que satélites o vão observar.</p>
      <p id="answer-sub" class="answer-sub" data-i18n="answer_idle_sub"></p>
    </div>
    <div class="bar-tools">
      <span id="freshness" class="badge"></span>
      <button id="theme" type="button" class="quiet" aria-pressed="false">Tema escuro</button>
      <button id="lang" type="button" class="quiet">English</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="query" aria-label="Pesquisa">
      <section>
        <h2 data-i18n="roi_heading">Local</h2>
        <div class="segmented" role="group" aria-label="Forma do local">
          <button type="button" data-mode="point" aria-pressed="true" data-i18n="mode_point">Ponto</button>
          <button type="button" data-mode="polygon" aria-pressed="false" data-i18n="mode_polygon">Polígono</button>
          <button type="button" data-mode="rectangle" aria-pressed="false" data-i18n="mode_rectangle">Rectângulo</button>
        </div>
        <p id="draw-hint" class="hint"></p>
        <div id="draw-actions" class="row" hidden>
          <button id="draw-finish" type="button" class="secondary" data-i18n="draw_finish">Terminar</button>
          <button id="draw-cancel" type="button" class="quiet" data-i18n="draw_cancel">Cancelar</button>
        </div>
        <details>
          <summary data-i18n="coords_summary">Escrever coordenadas</summary>
          <label class="field"><span data-i18n="crs_label">Sistema de coordenadas</span><select id="crs"></select></label>
          <label class="field" id="custom-wrap" hidden><span data-i18n="custom_crs">Definição proj4</span><input id="custom-crs" type="text" spellcheck="false"></label>
          <label class="field"><span id="coords-label"></span><textarea id="coords" rows="3" spellcheck="false" placeholder="37.573, -7.971"></textarea></label>
          <button id="apply-coords" type="button" class="secondary" data-i18n="roi_apply">Usar coordenadas</button>
        </details>
        <details>
          <summary data-i18n="file_summary">Carregar ficheiro</summary>
          <input id="roi-file" type="file" accept=".geojson,.json,.kml,.kmz,.zip">
          <p class="hint" data-i18n="file_hint"></p>
        </details>
        <label class="field"><span data-i18n="buffer_label">Margem à volta do local (km)</span><input id="buffer" type="number" min="0" max="200" step="0.5" value="0"></label>
        <p id="roi-summary" class="hint"></p>
        <p id="roi-error" class="error" hidden></p>
        <button id="roi-clear" type="button" class="quiet" hidden data-i18n="roi_clear">Limpar local</button>
      </section>
      <section>
        <h2 data-i18n="window_heading">Janela</h2>
        <label class="field"><span data-i18n="window_start">Início (UTC)</span><input id="start" type="datetime-local"></label>
        <label class="field"><span data-i18n="window_days">Duração (dias)</span><input id="days" type="number" min="1" max="30" value="16"></label>
        <p id="days-warn" class="hint warn" hidden data-i18n="window_long"></p>
      </section>
      <section>
        <h2 data-i18n="instruments_heading">Instrumentos</h2>
        <ul id="instruments" class="instruments"></ul>
        <label class="check"><input id="transitional" type="checkbox"> <span data-i18n="include_transitional"></span></label>
      </section>
      <button id="run" type="button" class="primary" disabled data-i18n="run">Calcular passagens</button>
      <p id="progress" class="hint" aria-live="polite"></p>
    </aside>

    <main class="map-wrap">
      <div id="globe" class="globe" role="application" aria-label="Globo"></div>
      <div class="timebar">
        <button id="play" type="button" class="secondary" aria-pressed="true">Pausa</button>
        <label class="speed"><span data-i18n="time_speed">Velocidade</span>
          <select id="speed">
            <option value="1">1×</option>
            <option value="60" selected>60×</option>
            <option value="300">300×</option>
            <option value="1200">1200×</option>
          </select>
        </label>
        <button id="now" type="button" class="secondary" data-i18n="time_now">Agora</button>
        <label class="speed"><span data-i18n="basemap_label">Mapa de base</span><select id="basemap"></select></label>
        <output id="clock" class="clock"></output>
      </div>
    </main>
  </div>

  <section class="tabs">
    <div role="tablist" class="tablist">
      <button role="tab" id="tab-table" aria-controls="panel-table" aria-selected="true" data-i18n="tab_table">Tabela</button>
      <button role="tab" id="tab-absences" aria-controls="panel-absences" aria-selected="false" tabindex="-1" data-i18n="tab_absences">Ausências</button>
      <button role="tab" id="tab-geo" aria-controls="panel-geo" aria-selected="false" tabindex="-1" data-i18n="tab_geo">Geoestacionários</button>
      <button role="tab" id="tab-about" aria-controls="panel-about" aria-selected="false" tabindex="-1" data-i18n="tab_about">Sobre e limitações</button>
    </div>
    <div role="tabpanel" id="panel-table" aria-labelledby="tab-table">
      <div class="panel-tools">
        <span id="link-status" class="hint" aria-live="polite"></span>
        <button id="copy-link" type="button" class="secondary" disabled data-i18n="copy_link">Copiar link</button>
        <button id="export-csv" type="button" class="secondary" disabled data-i18n="export_csv">Exportar CSV</button>
      </div>
      <div class="table-wrap"><table id="passes"><thead></thead><tbody></tbody></table></div>
      <p id="table-empty" class="hint" data-i18n="table_empty"></p>
    </div>
    <div role="tabpanel" id="panel-absences" aria-labelledby="tab-absences" hidden>
      <ul id="absences" class="absences"></ul>
    </div>
    <div role="tabpanel" id="panel-geo" aria-labelledby="tab-geo" hidden>
      <p class="hint" data-i18n="geo_hint"></p>
      <ul id="geo-list" class="absences"></ul>
    </div>
    <div role="tabpanel" id="panel-about" aria-labelledby="tab-about" hidden class="prose"></div>
  </section>
</body>
</html>
